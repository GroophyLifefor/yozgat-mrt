name: Cache libata

# Populates libata.so cache in main branch scope so tag-triggered release
# workflows can restore it (tags cannot read other tags' caches).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-libata:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.15

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev patchelf

      - name: Install shards
        run: shards install

      - name: Resolve ata-validator source commit
        id: ata-src
        run: |
          SHA=$(git ls-remote https://github.com/ata-core/ata-validator.git HEAD | cut -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache libata build
        id: libata-cache
        uses: actions/cache@v5
        with:
          path: lib/ata-validator-crystal/libata
          key: libata-bundle-${{ steps.ata-src.outputs.sha }}
          restore-keys: |
            libata-bundle-

      - name: Prepare libata bundle
        env:
          ATA_VALIDATOR_SRC: /tmp/ata-validator
        run: bash scripts/ci/prepare-libata.sh
