name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.15

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Verify libata vendor bundle
        run: |
          lib_dir="${GITHUB_WORKSPACE}/vendor/libata/linux-x64"
          test -f "${lib_dir}/libata.so" || { echo "missing ${lib_dir}/libata.so — commit the linux vendor bundle"; exit 1; }
          test -f "${lib_dir}/MANIFEST" || { echo "missing ${lib_dir}/MANIFEST"; exit 1; }

      - name: Cache shards
        uses: actions/cache@v5
        with:
          path: lib
          key: shards-${{ hashFiles('shard.yml', 'shard.lock') }}
          restore-keys: |
            shards-

      - name: Install shards
        run: shards install

      - name: Build release binary
        run: |
          mkdir -p bin
          lib_dir="${GITHUB_WORKSPACE}/vendor/libata/linux-x64"
          crystal build src/main.cr --release --no-debug \
            -o bin/yozgat \
            --link-flags "-L${lib_dir} -lata -Wl,-rpath-link,${lib_dir}"

      - name: Package release bundle
        shell: bash
        run: |
          bundle_dir="yozgat-x86_64-linux-gnu"
          lib_dir="${GITHUB_WORKSPACE}/vendor/libata/linux-x64"
          mkdir -p "${bundle_dir}/public"
          cp bin/yozgat "${bundle_dir}/"
          cp -P "${lib_dir}"/*.so* "${bundle_dir}/"
          cp -r public/. "${bundle_dir}/public/"
          tar -czf "yozgat-x86_64-linux-gnu.tar.gz" -C "${bundle_dir}" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          files: yozgat-x86_64-linux-gnu.tar.gz
