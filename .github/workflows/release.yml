name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.15

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libsqlite3-dev patchelf

      - name: Install shards
        run: shards install

      - name: Resolve ata-validator source commit
        id: ata-src
        run: |
          SHA=$(git ls-remote https://github.com/ata-core/ata-validator.git HEAD | cut -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Cache libata build
        id: libata-cache
        uses: actions/cache@v5
        with:
          path: lib/ata-validator-crystal/libata
          key: libata-bundle-v2-${{ steps.ata-src.outputs.sha }}
          restore-keys: |
            libata-bundle-v2-
            libata-bundle-

      - name: Prepare libata bundle
        env:
          ATA_VALIDATOR_SRC: /tmp/ata-validator
        run: bash scripts/ci/prepare-libata.sh

      - name: Build release binary
        run: |
          mkdir -p bin
          lib_dir="${GITHUB_WORKSPACE}/lib/ata-validator-crystal/libata"
          crystal build src/main.cr --release --no-debug \
            -o bin/yozgat \
            --link-flags "-L${lib_dir} -lata -Wl,-rpath-link,${lib_dir}"

      - name: Package release bundle
        shell: bash
        run: |
          bundle_dir="yozgat-x86_64-linux-gnu"
          lib_dir="${GITHUB_WORKSPACE}/lib/ata-validator-crystal/libata"
          mkdir -p "${bundle_dir}/public"
          cp bin/yozgat "${bundle_dir}/"
          cp -P "${lib_dir}"/*.so* "${bundle_dir}/"
          cp -r public/. "${bundle_dir}/public/"
          tar -czf "yozgat-x86_64-linux-gnu.tar.gz" -C "${bundle_dir}" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          files: yozgat-x86_64-linux-gnu.tar.gz
