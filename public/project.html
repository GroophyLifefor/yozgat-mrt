<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects · Yozgat</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a href="/index.html" class="sidebar-brand">
          <img src="/yozgat-logo-square.png" alt="" onerror="this.style.display='none'">
          <span>YOZGAT</span>
        </a>
        <nav>
          <a href="/index.html">Map</a>
          <a href="/project.html" class="active">Projects</a>
          <a href="/create-project.html">New project</a>
          <a href="/docs.html">API docs</a>
          <a href="/index.html">Settings</a>
        </nav>
        <div class="sidebar-footer">
          <span id="sidebar-user">…</span>
          <button type="button" class="secondary inline" id="logout">Sign out</button>
        </div>
      </aside>

      <div class="workspace">
        <header class="app-topbar">
          <span class="app-topbar-title">Projects</span>
          <span class="spacer"></span>
          <a href="/create-project.html"><button type="button" class="primary inline">New project</button></a>
        </header>

        <div class="workspace-content">
          <main>
            <div id="error" class="error"></div>
            <div id="server-meta" class="hint" style="margin-bottom:1rem"></div>

            <div class="panel" id="projects-panel">
              <p class="muted">Loading…</p>
            </div>
          </main>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
    <script>
      (async function () {
        const user = await requireAuth();
        if (!user) return;
        mountShell(user);

        try {
          const info = await apiJson("/server/info");
          if (info.res.ok && info.data) {
            const ip = info.data.publicIp || "—";
            document.getElementById("server-meta").textContent =
              "Server v" + (info.data.version || "?") + " · public IP " + ip;
          }
        } catch { /* optional */ }

        await loadProjects();
      })();

      async function loadProjects() {
        const panel = document.getElementById("projects-panel");
        const { res, data } = await apiJson("/projects");
        if (!res.ok) {
          showError((data && data.error) || "Could not load projects");
          panel.innerHTML = "";
          return;
        }

        const projects = (data && data.projects) || [];
        if (projects.length === 0) {
          panel.innerHTML =
            '<div class="empty">' +
            "<h3>No projects yet</h3>" +
            "<p>Connect a GitHub repository to deploy your first site.</p>" +
            '<a href="/create-project.html"><button type="button" class="primary inline">New project</button></a>' +
            "</div>";
          return;
        }

        let html =
          '<div class="table-wrap"><table><thead><tr>' +
          "<th>Name</th><th>Status</th><th>Type</th><th>Repository</th><th>Created</th>" +
          "</tr></thead><tbody>";

        for (const p of projects) {
          html +=
            '<tr class="clickable" data-id="' + p.id + '">' +
            "<td><strong>" + escapeHtml(p.name) + "</strong></td>" +
            '<td><span class="status-pill ' + statusClass(p.status) + '">' + escapeHtml(p.status) + "</span></td>" +
            "<td>" + escapeHtml(projectTypeLabel(p.projectType)) + "</td>" +
            '<td class="mono">' + escapeHtml(p.repoUrl) + "</td>" +
            "<td>" + escapeHtml(formatDate(p.createdAt)) + "</td>" +
            "</tr>";
        }

        html += "</tbody></table></div>";
        panel.innerHTML = html;

        panel.querySelectorAll("tr.clickable").forEach((row) => {
          row.addEventListener("click", () => {
            location.href = "/project-detail.html?id=" + row.dataset.id;
          });
        });
      }
    </script>
  </body>
</html>
