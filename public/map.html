<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Map · Yozgat</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/map.css">
  </head>
  <body class="map-app">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img src="/yozgat-logo-square.png" alt="" onerror="this.style.display='none'">
          <span>YOZGAT</span>
        </div>
        <nav>
          <a href="/map.html" class="active">Map</a>
          <a href="/index.html">Projects</a>
          <a href="/create-project.html">New project</a>
          <a href="/docs" target="_blank" rel="noopener">API docs</a>
          <a href="/index.html">Settings</a>
        </nav>
        <div class="sidebar-footer">
          <span id="sidebar-user">…</span>
          <button type="button" class="secondary inline" id="logout">Sign out</button>
        </div>
      </aside>

      <div class="workspace">
        <header class="map-topbar">
          <input type="search" id="map-search" placeholder="Search projects, environments, services…" autocomplete="off">
          <span class="spacer"></span>
          <span class="map-status" id="map-status">—</span>
          <button type="button" class="secondary" id="btn-refresh">Refresh</button>
          <button type="button" class="secondary" id="btn-fit">Fit view</button>
        </header>

        <div class="map-viewport-wrap">
          <div class="map-loading" id="map-loading">Loading topology…</div>
          <div class="map-empty" id="map-empty" hidden>
            <div>
              <h3>No running services</h3>
              <p>Deploy a project to see the service map.</p>
            </div>
          </div>
          <div class="map-viewport" id="map-root">
            <svg class="map-edges" xmlns="http://www.w3.org/2000/svg"></svg>
            <div class="map-nodes"></div>
          </div>
          <div class="map-minimap" id="map-minimap"></div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
    <script src="/map.js"></script>
    <script>
      const map = new YozgatMap(document.getElementById("map-root"));
      let projects = [];
      let pollTimer = null;

      (async function () {
        const user = await requireAuth();
        if (!user) return;
        document.getElementById("sidebar-user").textContent = user.email;
        document.getElementById("logout").addEventListener("click", logout);

        bindControls();
        await loadTopology();
      })();

      function bindControls() {
        document.getElementById("btn-refresh").addEventListener("click", loadTopology);
        document.getElementById("btn-fit").addEventListener("click", () => map.fitView());
        document.getElementById("map-search").addEventListener("input", (e) => {
          map.setSearch(e.target.value);
        });
      }

      async function loadTopology() {
        if (pollTimer) clearInterval(pollTimer);
        map.setLoading(true);
        setStatus("Loading…");

        try {
          const { res, data } = await apiJson("/topology");

          if (!res.ok) {
            setStatus((data && data.error) || "Could not load topology");
            map.setHierarchy([]);
            return;
          }

          projects = (data && data.topology && data.topology.projects) || [];
          map.setHierarchy(projects);
          updateStatus();

          pollTimer = setInterval(refreshTopology, 15000);
        } finally {
          map.setLoading(false);
        }
      }

      async function refreshTopology() {
        const { res, data } = await apiJson("/topology");
        if (!res.ok || !data || !data.topology) return;

        projects = data.topology.projects || [];
        map.updateHierarchy(projects);
        updateStatus();
      }

      function updateStatus() {
        const envCount = projects.reduce((n, p) => n + (p.environments ? p.environments.length : 0), 0);
        setStatus(projects.length + " projects · " + envCount + " environments");
      }

      function setStatus(msg) {
        document.getElementById("map-status").textContent = msg;
      }
    </script>
  </body>
</html>
